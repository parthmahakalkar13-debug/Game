<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Apex Drive - Realistic Edition</title>
<style>
:root{--ac:#dfe3e8;--ac2:#b9b2a4;--bg:#101215;--tx:#eceef0;color-scheme:dark;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,14,18,.82);text-align:center;padding:20px;z-index:50;box-sizing:border-box;overflow-y:auto}
.hide{display:none!important}
h1{margin:0;font-size:clamp(30px,7vw,64px);letter-spacing:.14em;font-weight:300}
h1 b{font-weight:700}h2{margin:0;font-size:30px;font-weight:300;letter-spacing:.1em}
.sub{margin:0;opacity:.65;letter-spacing:.22em;text-transform:uppercase;font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;flex-direction:column;gap:4px}
select,input[type=range]{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid rgba(255,255,255,.2);padding:8px 10px;border-radius:4px;font-size:14px}
button{background:#e9ebee;color:#14171b;border:0;padding:13px 30px;font-weight:700;letter-spacing:.14em;border-radius:4px;font-size:14px;cursor:pointer}
button.alt{background:rgba(255,255,255,.14);color:var(--tx)}
.sw{display:flex;gap:8px}.sw i{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw i.on{border-color:#fff}.help{font-size:11px;opacity:.6;max-width:520px;margin:0;line-height:1.5}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.pn{position:absolute;background:rgba(14,16,20,.62);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;backdrop-filter:blur(5px);box-sizing:border-box}
#mm{left:12px;top:12px;padding:3px}#mm canvas{display:block;width:95px;height:95px}
#tl{display:none;left:50%;transform:translateX(-50%);top:12px;text-align:center;font-size:11px;letter-spacing:1px;white-space:nowrap}#tl b{font-size:20px}
#sp{right:12px;top:12px;text-align:right;min-width:120px}#spd{font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#unit{font-size:9px;opacity:.7;letter-spacing:.15em}#gear{font-weight:700}
.bar{height:4px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;width:0;background:#d8dbe0}
#tr{left:12px;bottom:185px;font-size:10px;font-variant-numeric:tabular-nums;width:135px}
#msg{left:50%;top:38%;transform:translateX(-50%);font-size:clamp(45px,12vw,100px);font-weight:300;background:none;border:0;backdrop-filter:none;padding:0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#warn{left:50%;top:22%;transform:translateX(-50%);color:#ffb4a8;font-weight:700;letter-spacing:1.5px;font-size:11px}
#fx{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 10px rgba(0,0,0,.45);opacity:0;z-index:5}
#fps{position:fixed;right:12px;bottom:8px;font:10px monospace;opacity:.6;z-index:20}
table{border-collapse:collapse;font-size:14px;width:100%;max-width:400px}td{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.1)}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:25}
.t-btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--tx)}
.t-btn.pressed{background:rgba(255,255,255,.35)}
#btn-accel{right:20px;bottom:130px;width:76px;height:76px;font-size:15px}#btn-brake{right:105px;bottom:85px;width:64px;height:64px;font-size:12px}

#joystick-base{position:absolute;left:20px;bottom:20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#joystick-stick{position:absolute;top:25px;left:25px;width:60px;height:60px;border-radius:50%;background:rgba(235,238,242,.7)}
</style></head><body>
<canvas id="c"></canvas><div id="fx"></div><div id="fps" class="hide"></div>
<div id="hud" class="hide">
 <div class="pn" id="mm"><canvas id="mmc" width="95" height="95"></canvas></div>
 <div class="pn" id="tl">POS <b id="pos">1</b>/<span id="tot">4</span> &nbsp; LAP <b id="lap">1</b>/1</div>
 <div class="pn" id="tr">TIME <span id="time">0:00.000</span><br>BEST <span id="best">--</span></div>

</div>
<div id="touch-controls"><div id="joystick-base"><div id="joystick-stick"></div></div>
 <div id="btn-accel" class="t-btn">GAS</div><div id="btn-brake" class="t-btn">REV</div></div>
<div id="menu" class="ov">
 <h1>APEX <b>DRIVE</b></h1><p class="sub">Countryside Road Circuit · 1 Lap</p>
 <div class="row">
  <label>Opponents<select id="sO"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label>
  <label>AI<select id="sD"><option>easy</option><option selected>medium</option><option>hard</option></select></label>
  <label>Graphics<select id="sQ"><option value="low">Mobile Perf</option><option value="med">Mobile High</option><option value="high" selected>High</option></select></label>
  <label>Time<select id="sT"><option value="morning">Morning</option><option value="midday" selected>Midday</option><option value="golden">Golden hour</option><option value="sunset">Sunset</option></select></label>
  <label>Weather<select id="sW"><option value="clear" selected>Clear</option><option value="overcast">Overcast</option><option value="fog">Fog</option></select></label>
  <label>Unit<select id="sU"><option value="kmh">km/h</option><option value="mph">mph</option></select></label>
  <label>Volume<input type="range" id="sV" min="0" max="1" step=".05" value=".6"></label>
 </div>
 <p class="sub">Paint</p><div class="sw" id="sw"></div><br>
 <button id="go">START RACE</button>
 <p class="help">Left joystick steers. GAS / REV on the right. Keyboard: WASD or arrows, C camera.</p>
</div>
<div id="pause" class="ov hide"><h2>PAUSED</h2><div class="row"><button id="rs">RESUME</button><button id="rt" class="alt">RESTART</button><button id="mn" class="alt">MAIN MENU</button></div></div>
<div id="end" class="ov hide"><h2 id="eh">FINISH</h2><table id="et"></table><div class="row"><button id="ry">RETRY</button><button id="em" class="alt">MAIN MENU</button></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s),TAU=Math.PI*2,V3=THREE.Vector3,rnd=Math.random;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const COLORS=['#9a9da1','#27415f','#6e2020','#dcdcd8','#1c1d1f','#33493c'];

const fmt=t=>t==null?'--':Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');

let R;try{R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true})}catch(e){$('#menu').innerHTML='<h1>WebGL unavailable</h1>';throw e}
R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;

 const m=S.q=='high'?2048:1024;sun.castShadow=S.q!='low';if(sun.shadow.mapSize.x!=m){sun.shadow.mapSize.set(m,m);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}}
const cv=(w,h,fn,enc=true)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(enc)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};

 golden:{el:13,az:2.0,c:0xffd6a8,i:2.3,top:'#5b87c2',hor:'#efd3b0'},sunset:{el:5,az:1.9,c:0xffb88a,i:1.7,top:'#3f5c96',hor:'#e6ac88'}};

 const T=TOD[S.tod],oc=S.wx!='clear',x=skyC.getContext('2d'),w=1024,h=512,g=x.createLinearGradient(0,0,0,h);
 const hor=oc?'#c5cacd':T.hor;g.addColorStop(0,oc?'#7f8b97':T.top);g.addColorStop(.5,hor);g.addColorStop(1,hor);x.fillStyle=g;x.fillRect(0,0,w,h);
 for(let n=0;n<(oc?90:26);n++){x.save();x.translate(rnd()*w,h*(.12+rnd()*.34));x.scale(3+rnd()*3,1);const r=18+rnd()*30,rg=x.createRadialGradient(0,0,0,0,0,r);

 skyT.needsUpdate=true;

 scene.fog.color.set(hor);scene.fog.near=S.wx=='fog'?5:150;scene.fog.far=S.wx=='fog'?240:oc?1200:1700;R.toneMappingExposure=S.tod=='midday'?.85:.95;
 const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide})));
 if(envT)envT.dispose();envT=pm.fromScene(es,.04).texture;scene.environment=envT;
}

/* Track */
const W=18,N=600,CP=[];
for(let i=0;i<12;i++){const t=i/12*TAU,r=380+110*Math.sin(3*t+1)+60*Math.cos(2*t);CP.push(new V3(r*Math.cos(t),0,r*Math.sin(t)))}

const pts=curve.getSpacedPoints(N).slice(0,N);pts.forEach(p=>p.y=0);
const tan=[],sid=[],hd=[];

const asphaltT=cv(256,512,(x,w,h)=>{x.fillStyle='#46474a';x.fillRect(0,0,w,h);
 for(let i=0;i<70;i++){x.fillStyle=`rgba(${rnd()<.5?'20,20,22':'95,95,98'},${.05+rnd()*.07})`;x.fillRect(rnd()*w,rnd()*h,20+rnd()*90,10+rnd()*120)}
 [[72,18],[184,18]].forEach(a=>{const g=x.createLinearGradient(a[0]-a[1],0,a[0]+a[1],0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(10,10,12,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(a[0]-a[1],0,2*a[1],h)});
 x.strokeStyle='rgba(15,15,16,.55)';x.lineWidth=1;for(let i=0;i<14;i++){x.beginPath();let px=rnd()*w,py=rnd()*h;x.moveTo(px,py);for(let k=0;k<6;k++){px+=(rnd()-.5)*40;py+=rnd()*30;x.lineTo(px,py)}x.stroke()}
 x.fillStyle='rgba(228,228,222,.92)';x.fillRect(10,0,4,h);x.fillRect(w-14,0,4,h);
 x.fillStyle='rgba(205,165,40,.92)';x.fillRect(120,0,4,h);x.fillRect(132,0,4,h);
 for(let i=0;i<60;i++){x.fillStyle='rgba(55,55,58,.55)';x.fillRect(rnd()<.3?rnd()*w:[10,w-14,120,132][rnd()*4|0],rnd()*h,4,3+rnd()*14)}
 grain(x,w,h,.3)});
asphaltT.wrapS=asphaltT.wrapT=THREE.RepeatWrapping;
const dirtT=rep(cv(128,128,(x,w,h)=>{x.fillStyle='#6f6552';x.fillRect(0,0,w,h);for(let i=0;i<300;i++){x.fillStyle=`rgba(${rnd()<.5?'50,45,35':'140,130,110'},.18)`;x.fillRect(rnd()*w,rnd()*h,2+rnd()*8,2+rnd()*6)}grain(x,w,h,.3)}),1,1);
const grassT=rep(cv(256,256,(x,w,h)=>{x.fillStyle='#5a6636';x.fillRect(0,0,w,h);for(let i=0;i<90;i++){x.fillStyle=['rgba(88,98,45,.3)','rgba(66,80,38,.3)','rgba(125,115,65,.22)'][i%3];x.beginPath();x.ellipse(rnd()*w,rnd()*h,10+rnd()*30,8+rnd()*20,rnd()*3,0,TAU);x.fill()}grain(x,w,h,.35)}),260,260);
function strip(w,y,mat,vs){const pos=[],uv=[],nr=[],idx=[];
 for(let i=0;i<=N;i++){const k=i%N,p=pts[k],s=sid[k],v=i*SEG/vs;pos.push(p.x+s.x*w/2,y,p.z+s.z*w/2,p.x-s.x*w/2,y,p.z-s.z*w/2);uv.push(0,v,1,v);nr.push(0,1,0,0,1,0);if(i<N){const a=2*i;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nr,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
 const m=new THREE.Mesh(g,mat);m.receiveShadow=true;scene.add(m)}
strip(W,.04,new THREE.MeshStandardMaterial({map:asphaltT,roughness:.88,metalness:0,side:THREE.DoubleSide}),22);
{const m=new THREE.MeshStandardMaterial({map:dirtT,roughness:1,side:THREE.DoubleSide});dirtT.repeat.set(1,1);strip(W+9,.02,m,6)}
{const gr=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.MeshStandardMaterial({map:grassT,roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.y=-.1;gr.receiveShadow=true;scene.add(gr)}
{const n=96,pos=[],col=[],idx=[],c1=new THREE.Color('#566656'),c2=new THREE.Color('#7d8a8c');
 for(let i=0;i<=n;i++){const a=i/n*TAU,hh=40+90*Math.abs(Math.sin(a*3+1)*Math.cos(a*5))+40*Math.sin(a*11)**2+(i%n==0?0:0);pos.push(Math.cos(a)*1250,-5,Math.sin(a)*1250,Math.cos(a)*1180,hh,Math.sin(a)*1180);const c=c1.clone().lerp(c2,hh/200);col.push(c1.r,c1.g,c1.b,c.r,c.g,c.b);if(i<n){const k=2*i;idx.push(k,k+1,k+2,k+1,k+3,k+2)}}

const farFromRoad=(x,z,d)=>{for(let k=0;k<N;k+=3){const dx=pts[k].x-x,dz=pts[k].z-z;if(dx*dx+dz*dz<d*d)return false}return true};
/* guardrails, streetlights */
{const rails=[],poles=[],arms=[];
 for(let i=0;i<N;i++)[1,-1].forEach(sd=>{const o=W/2+.5;rails.push({x:pts[i].x+sid[i].x*sd*o,y:.62,z:pts[i].z+sid[i].z*sd*o,ry:hd[i],sz:SEG*1.04});
  if(i%9==(sd>0?0:4)){const px=pts[i].x+sid[i].x*sd*(W/2+3),pz=pts[i].z+sid[i].z*sd*(W/2+3);poles.push({x:px,y:4.5,z:pz});arms.push({x:px-sid[i].x*sd*1.1,y:9,z:pz-sid[i].z*sd*1.1,ry:Math.atan2(-sid[i].x*sd,-sid[i].z*sd)})}});
 inst(new THREE.BoxGeometry(.12,.32,1),new THREE.MeshStandardMaterial({color:0x9ea4a8,metalness:.75,roughness:.4}),rails,true);
 const pm_=new THREE.MeshStandardMaterial({color:0x6d7275,metalness:.6,roughness:.5});
 inst(new THREE.CylinderGeometry(.1,.14,9,8),pm_,poles,true);inst(new THREE.BoxGeometry(.14,.14,2.4),pm_,arms,true)}
{const chk=cv(64,16,x=>{for(let i=0;i<16;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?'#e8e8e8':'#1b1b1b';x.fillRect(i*4,j*4,4,4)}});
 const f=new THREE.Mesh(new THREE.BoxGeometry(W,.05,3),new THREE.MeshStandardMaterial({map:chk,roughness:.9}));f.position.copy(pts[0]);f.position.y=.09;f.rotation.y=hd[0];f.receiveShadow=true;scene.add(f);
 const gm=new THREE.MeshStandardMaterial({color:0x5b6064,metalness:.5,roughness:.5});
 [1,-1].forEach(sd=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.6,8,.6),gm);p.position.set(pts[0].x+sid[0].x*sd*(W/2+1.2),4,pts[0].z+sid[0].z*sd*(W/2+1.2));p.castShadow=true;scene.add(p)});
 const b=new THREE.Mesh(new THREE.BoxGeometry(W+3,1.2,.6),new THREE.MeshStandardMaterial({color:0xd8d8d4,roughness:.6}));b.position.copy(pts[0]);b.position.y=8;b.rotation.y=hd[0];b.castShadow=true;scene.add(b)}
/* trees: pine, broadleaf, poplar (jittered geometry, per-instance colour/scale) */

 if(state=='race'&&msgT>0){msgT-=dt;if(msgT<=0)$('#msg').textContent=''}
 if(state=='menu'){cars.forEach(c=>sync(c,dt));return}
 if(state=='race')raceT+=dt;
 if(endWait){endT+=dt;if(endT>8||cars.every(c=>c.finished)){endWait=false;showEnd()}}
 const go=state=='race',zero={th:0,br:0,steer:0,hb:false,nit:false};
 for(const c of cars){const inp=!go?zero:(c.ai||c.finished)?aiIn(c):playerIn();step(c,inp,dt);trk(c);if(c.ai&&go&&!c.finished){c.still=c.vf<2?c.still+dt:0;if(c.still>3)resetCar(c)}}
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++)collide(cars[i],cars[j]);
 [...cars].sort((a,b)=>b.prog-a.prog).forEach((c,i)=>c.rank=i+1);cars.forEach(c=>sync(c,dt));hitT=Math.max(0,hitT-dt);hud()}
function resetCar(c){const p=pts[c.idx];c.x=p.x;c.z=p.z;c.h=hd[c.idx];c.vx=c.vz=c.vf=c.vl=0;c.still=0;if(c===P)snap=true}
let fpsOn=false,fN=0,fT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-(loop.l||now))/1000);loop.l=now;tm+=dt;if(!paused)update(dt);cam(dt);audioUpd();R.render(scene,camera);
 fN++;fT+=dt;if(fT>=.5){if(fpsOn)$('#fps').textContent=Math.round(fN/fT)+' FPS';fN=0;fT=0}}
/* Input */
const GK=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'];
addEventListener('keydown',e=>{if(GK.includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;
 if(e.code=='KeyC'&&state!='menu')camMode=(camMode+1)%3;if(e.code=='KeyR'&&state=='race')resetCar(P);if(e.code=='KeyM'&&A)A.mute=!A.mute;if(e.code=='KeyF'){fpsOn=!fpsOn;show('#fps',fpsOn)}
 if(e.code=='Escape'&&(state=='race'||state=='count')){paused=!paused;show('#pause',paused)}});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const jBase=$('#joystick-base'),jStick=$('#joystick-stick');let jActive=false,jC={x:0,y:0};const jR=38;
function jMove(x,y){const dx=x-jC.x,dy=y-jC.y,d=Math.min(Math.hypot(dx,dy),jR),a=Math.atan2(dy,dx),sx=Math.cos(a)*d;jStick.style.transform=`translate(${sx}px,${Math.sin(a)*d}px)`;touchInput.steer=-(sx/jR)}
const jEnd=()=>{jActive=false;touchInput.steer=0;jStick.style.transform='translate(0,0)'};
jBase.addEventListener('pointerdown',e=>{e.preventDefault();jActive=true;const r=jBase.getBoundingClientRect();jC={x:r.left+r.width/2,y:r.top+r.height/2};jMove(e.clientX,e.clientY);jBase.setPointerCapture(e.pointerId)});
jBase.addEventListener('pointermove',e=>{if(jActive){e.preventDefault();jMove(e.clientX,e.clientY)}});jBase.addEventListener('pointerup',jEnd);jBase.addEventListener('pointercancel',jEnd);
const bindT=(sel,prop)=>{const el=$(sel),on=e=>{e.preventDefault();touchInput[prop]=1;el.classList.add('pressed')},off=e=>{e.preventDefault();touchInput[prop]=0;el.classList.remove('pressed')};
 el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,off))};
bindT('#btn-accel','th');bindT('#btn-brake','br');
addEventListener('resize',applyQ);
$('#go').onclick=()=>{audio();if(A&&A.x.state=='suspended')A.x.resume();begin()};
$('#rs').onclick=()=>{paused=false;show('#pause',false)};$('#rt').onclick=begin;$('#mn').onclick=toMenu;$('#ry').onclick=begin;$('#em').onclick=toMenu;
$('#sO').value=S.opp;$('#sD').value=S.diff;$('#sQ').value=S.q;$('#sU').value=S.units;$('#sV').value=S.vol;$('#sT').value=S.tod;$('#sW').value=S.wx;
$('#sO').onchange=e=>{S.opp=+e.target.value;save();setup()};$('#sD').onchange=e=>{S.diff=e.target.value;save()};$('#sQ').onchange=e=>{S.q=e.target.value;save();applyQ()};
$('#sU').onchange=e=>{S.units=e.target.value;save()};$('#sV').oninput=e=>{S.vol=+e.target.value;save()};
$('#sT').onchange=e=>{S.tod=e.target.value;save();applyTOD()};$('#sW').onchange=e=>{S.wx=e.target.value;save();applyTOD()};
COLORS.forEach((c,i)=>{const s=document.createElement('i');s.style.background=c;if(i==S.color)s.className='on';
 s.onclick=()=>{S.color=i;save();[...$('#sw').children].forEach((x,j)=>x.classList.toggle('on',j==i));P.m.g.traverse(o=>{if(o.material&&o.material.clearcoat!==undefined)o.material.color.set(c)})};$('#sw').appendChild(s)});
applyQ();applyTOD();setup();requestAnimationFrame(loop);
</script></body></html>
